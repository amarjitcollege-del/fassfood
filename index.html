<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteDash | Fast & Delicious Food</title>
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #e84118;
            --dark: #2f3542;
            --light: #f1f2f6;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
            --admin-color: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: var(--dark);
        }

        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .cart-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn:hover {
            background: var(--primary-hover);
        }

        .admin-toggle-btn {
            background: var(--dark);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        .cart-count {
            background: var(--white);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 14px;
        }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1561758033-d89a9ad46330?q=80&w=1200&auto=format&fit=crop') no-repeat center center/cover;
            height: 35vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--white);
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .menu-title {
            margin-bottom: 20px;
            font-size: 28px;
            border-left: 5px solid var(--primary);
            padding-left: 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .menu-item {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
            transition: transform 0.3s;
        }

        .menu-item:hover { transform: translateY(-5px); }

        .item-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .item-info { padding: 15px; }
        .item-title { font-size: 18px; margin-bottom: 8px; }
        .item-price { color: var(--primary); font-weight: bold; font-size: 18px; margin-bottom: 12px; }
        
        .add-btn {
            width: 100%;
            background: var(--dark);
            color: var(--white);
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn:hover { background: var(--primary); }

        /* Owner Delete Button style */
        .delete-item-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 71, 87, 0.9);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: none; /* Controlled by admin state */
            z-index: 10;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            height: fit-content;
        }

        .cart-title {
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--light);
        }

        .cart-items { margin-bottom: 20px; max-height: 240px; overflow-y: auto; }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .cart-item-remove { color: var(--primary); cursor: pointer; font-weight: bold; margin-left: 8px; }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            border-top: 2px solid var(--light);
            padding-top: 15px;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            background: #2ed573;
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .checkout-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Owner Admin Section */
        .admin-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-top: 5px solid var(--admin-color);
            display: none; /* Hidden by default */
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            width: 90%; max-width: 400px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 20px; cursor: pointer; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;
        }

        .submit-btn {
            width: 100%; background: var(--primary); color: var(--white);
            border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .submit-btn.admin-variant { background: var(--admin-color); }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <nav class="navbar">
            <a href="#" class="logo">🍔 BiteDash</a>
            <div class="nav-buttons">
                <button class="admin-toggle-btn" onclick="toggleAdminPanel()">🛠️ Owner Mode</button>
                <button class="cart-btn" onclick="scrollToCart()">
                    🛒 Cart <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <h1>Craving Something Delicious?</h1>
        <p>Fresh ingredients, fast delivery, unbeatable taste.</p>
    </section>

    <!-- Main Section -->
    <div class="container">
        <!-- Left Side: Menu -->
        <div>
            <h2 class="menu-title">Our Menu <span id="adminModeIndicator" style="font-size: 14px; color: var(--admin-color); display: none;">(Owner Editing Enabled)</span></h2>
            <div class="menu-grid" id="menuGrid">
                <!-- Items injected by JavaScript -->
            </div>
        </div>

        <!-- Right Side: Cart -->
        <div class="cart-sidebar" id="cartSidebar">
            <h3 class="cart-title">Your Order</h3>
            <div class="cart-items" id="cartItems">
                <p style="color: #888; text-align: center;">Your cart is empty</p>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">₹0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled onclick="toggleModal('orderModal', true)">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Owner / Admin Panel Box -->
    <div class="admin-section" id="adminPanel">
        <h3 style="color: var(--admin-color);">🛠️ Owner Menu Control Settings</h3>
        <p style="font-size: 14px; color: #666;">Add items here to seamlessly update your live digital menu storefront.</p>
        
        <form id="addItemForm" onsubmit="addNewProduct(event)">
            <div class="admin-grid">
                <div class="form-group">
                    <label>Food Item Name</label>
                    <input type="text" id="newProdName" required placeholder="e.g., Double Cheese Burger">
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="newProdPrice" required placeholder="e.g., 180">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="newProdImg" placeholder="Paste link or leave blank for default photo">
                </div>
            </div>
            <button type="submit" class="submit-btn admin-variant" style="margin-top: 10px; width: auto; padding: 10px 25px;">＋ Add Item To Menu</button>
        </form>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleModal('orderModal', false)">&times;</span>
            <h3 style="margin-bottom: 20px;">Delivery Details</h3>
            <form id="orderForm" onsubmit="placeOrder(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="Enter active phone number">
                </div>
                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" rows="3" required placeholder="Enter full address"></textarea>
                </div>
                <button type="submit" class="submit-btn">Confirm Order</button>
            </form>
        </div>
    </div>

    <script>
        // Initial Menu Array
        let menuProducts = [
            { id: 1, name: "Classic Cheeseburger", price: 149, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=500&auto=format&fit=crop" },
            { id: 2, name: "Loaded Pepperoni Pizza", price: 299, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=500&auto=format&fit=crop" },
            { id: 3, name: "Crispy French Fries", price: 99, img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?q=80&w=500&auto=format&fit=crop" },
            { id: 4, name: "Crunchy Chicken Wings", price: 199, img: "https://images.unsplash.com/photo-1567620832903-9fc6debc209f?q=80&w=500&auto=format&fit=crop" }
        ];

        let cart = [];
        let isAdminMode = false;

        // Render Menu Items
        function displayMenu() {
            const menuGrid = document.getElementById('menuGrid');
            
            menuGrid.innerHTML = menuProducts.map(product => `
                <div class="menu-item">
                    <button class="delete-item-btn" style="display: ${isAdminMode ? 'block' : 'none'};" onclick="deleteProduct(${product.id})">Remove ✕</button>
                    <img src="${product.img}" alt="${product.name}" class="item-img">
                    <div class="item-info">
                        <h3 class="item-title">${product.name}</h3>
                        <div class="item-price">₹${product.price}</div>
                        <button class="add-btn" onclick="addToCart(${product.id})">Add to Order</button>
                    </div>
                </div>
            `).join('');
        }

        // Toggle visibility of Admin Area Panel
        function toggleAdminPanel() {
            isAdminMode = !isAdminMode;
            const panel = document.getElementById('adminPanel');
            const indicator = document.getElementById('adminModeIndicator');
            const button = document.querySelector('.admin-toggle-btn');
            
            if(isAdminMode) {
                panel.style.display = "block";
                indicator.style.display = "inline";
                button.style.background = "var(--admin-color)";
                panel.scrollIntoView({ behavior: 'smooth' });
            } else {
                panel.style.display = "none";
                indicator.style.display = "none";
                button.style.background = "var(--dark)";
            }
            displayMenu(); // Re-render menu to show/hide delete buttons
        }

        // Add a completely custom new object to Menu array dynamically
        function addNewProduct(event) {
            event.preventDefault();
            
            const name = document.getElementById('newProdName').value;
            const price = parseFloat(document.getElementById('newProdPrice').value);
            let img = document.getElementById('newProdImg').value;

            // Fallback default image placeholder if left empty
            if (!img) {
                img = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=500&auto=format&fit=crop";
            }

            const newProduct = {
                id: Date.now(), // Safe unique ID using current timestamp
                name: name,
                price: price,
                img: img
            };

            menuProducts.push(newProduct);
            displayMenu();
            
            // Clear entry inputs safely
            document.getElementById('addItemForm').reset();
        }

        // Remove an item directly out of the application array
        function deleteProduct(productId) {
            if(confirm("Are you sure you want to remove this item from the store menu?")) {
                menuProducts = menuProducts.filter(p => p.id !== productId);
                removeFromCart(productId); // Remove it from active orders if present
                displayMenu();
            }
        }

        // Add Item to Cart Array
        function addToCart(productId) {
            const product = menuProducts.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        // Remove Item completely from Cart Array
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // Refresh and Update Cart Display elements
        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;

            if (cart.length === 0) {
                cartItems.innerHTML = `<p style="color: #888; text-align: center;">Your cart is empty</p>`;
                cartTotal.textContent = '₹0.00';
                checkoutBtn.disabled = true;
                return;
            }

            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <span>${item.name} <strong>x${item.quantity}</strong></span>
                    <span>₹${item.price * item.quantity} 
                        <span class="cart-item-remove" onclick="removeFromCart(${item.id})">&times;</span>
                    </span>
                </div>
            `).join('');

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.textContent = `₹${totalPrice}.00`;
            checkoutBtn.disabled = false;
        }

        function toggleModal(modalId, show) {
            document.getElementById(modalId).style.display = show ? 'flex' : 'none';
        }

        function scrollToCart() {
            document.getElementById('cartSidebar').scrollIntoView({ behavior: 'smooth' });
        }

        function placeOrder(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            alert(`Thank you, ${name}! Your order has been placed successfully. Delivery is on its way!`);
            cart = [];
            updateCartUI();
            toggleModal('orderModal', false);
            document.getElementById('orderForm').reset();
        }

        // Initial setup run
        displayMenu();
    </script>
</body>
</html>
